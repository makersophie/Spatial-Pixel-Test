<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zone markers</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: monospace;
      background: #fff;
    }
    .actions {
      text-align: center;
      margin-bottom: 12px;
    }
    .actions input {
      font: inherit;
      width: 12em;
    }
    #markers {
      display: grid;
      grid-template-columns: repeat(2, 2.6in);
      gap: 0.4in;
      justify-content: center;
    }
    .marker {
      padding: 0.15in;
      border: 1px dashed #999;
      text-align: center;
    }
    .marker img {
      display: block;
      width: 2.2in;
      height: 2.2in;
      margin: 0 auto 0.08in;
      image-rendering: pixelated;
    }
    @media print {
      @page { margin: 0.5in; }
      body { padding: 0; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <label>Zone name: <input id="name" value="desktop"></label>
    <button id="print">Print</button>
  </div>
  <div id="markers"></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    // Four copies of the same code. Cut them out and put one at each corner
    // of the area that should count as the zone; the camera page (mode
    // "2 QR zone") joins them into a polygon in clockwise order.
    const nameInput = document.getElementById('name');
    const container = document.getElementById('markers');

    function render() {
      const text = `zone:${nameInput.value.trim() || 'desktop'}`;
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const src = qr.createDataURL(8, 4);

      container.innerHTML = '';
      for (const corner of ['top-left', 'top-right', 'bottom-left', 'bottom-right']) {
        const marker = document.createElement('div');
        marker.className = 'marker';
        marker.innerHTML = `<img src="${src}" alt="QR code for ${text}"><div>${text} · ${corner}</div>`;
        container.appendChild(marker);
      }
    }

    nameInput.addEventListener('input', render);
    document.getElementById('print').addEventListener('click', () => window.print());
    render();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>map</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: monospace;
      background: #fff;
    }
    #sheet {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 80px);
      margin: 0 auto;
    }
    .actions {
      text-align: center;
      margin-bottom: 12px;
    }
    @media print {
      @page { margin: 0.4in; }
      body { padding: 0; }
      .actions { display: none; }
      #sheet { max-height: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <button id="print">Print</button>
    <a id="download" download="map-with-anchors.png">Download PNG</a>
  </div>
  <img id="sheet" alt="Floor plan with four QR anchor codes at its corners">
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="map.js"></script>
  <script src="sheet.js"></script>
  <script>
    drawMapSheet().then((canvas) => {
      const url = canvas.toDataURL('image/png');
      document.getElementById('sheet').src = url;
      document.getElementById('download').href = url;
    });

    document.getElementById('print').addEventListener('click', () => window.print());
  </script>
</body>
</html>

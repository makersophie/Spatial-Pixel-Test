<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cards</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: monospace;
      background: #fff;
    }
    .actions {
      text-align: center;
      margin-bottom: 12px;
    }
    #cards {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3in;
      justify-content: center;
    }
    .card {
      width: 1.8in;
      padding: 0.15in;
      border: 1px dashed #999;
      text-align: center;
    }
    .card .picture {
      font-size: 0.8in;
      line-height: 1;
    }
    .card img {
      display: block;
      width: 1.4in;
      height: 1.4in;
      margin: 0.1in auto;
      image-rendering: pixelated;
    }
    .card .name {
      font-size: 14pt;
      font-weight: bold;
    }
    .card .note {
      font-size: 9pt;
      color: #555;
    }
    @media print {
      @page { margin: 0.4in; }
      body { padding: 0; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <div class="actions">
    <button id="print">Print</button>
  </div>
  <div id="cards"></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    // Cut these out and move them around on the printed map.
    // The QR text must match a key in CARDS in script.js.
    const PRINTED = [
      { code: 'mouse-1', picture: '🐭', note: 'mouse' },
      { code: 'mouse-2', picture: '🐁', note: 'mouse' },
      { code: 'human', picture: '🧍', note: 'human' },
    ];

    const container = document.getElementById('cards');
    for (const { code, picture, note } of PRINTED) {
      const qr = qrcode(0, 'M');
      qr.addData(code);
      qr.make();

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="picture">${picture}</div>
        <img src="${qr.createDataURL(8, 4)}" alt="QR code for ${code}">
        <div class="name">${code}</div>
        <div class="note">${note}</div>`;
      container.appendChild(card);
    }

    document.getElementById('print').addEventListener('click', () => window.print());
  </script>
</body>
</html>
